
name: Sync Dallas Fed Image

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Dallas Fed image
        run: |
          mkdir -p charts
          curl -fLsS \
            'https://www.dallasfed.org/-/media/Images/research/wei/wei.png' \
            -o charts/wei.png

      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@noreply.github.com"

          git add charts/wei.png

          if ! git diff --cached --quiet; then
            git commit -m "Update Dallas Fed WEI chart"
            git push
          fi
